name: Deploy to Hostinger

on:
  push:
    branches:
      - main # Change this to your main branch if it's different (e.g., master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      # Hostinger's shared-hosting FTP firewall blocks connections from
      # GitHub Actions' runner IP ranges (control-socket timeout), and this
      # account has no SSH/SFTP access to fall back to. Pushing the built
      # site to a dedicated branch avoids that network path entirely: this
      # step only talks to github.com over HTTPS. Hostinger's own "Git"
      # auto-deploy (hPanel > Websites > Advanced > Git) then pulls from
      # this branch itself, so Hostinger initiates the connection instead
      # of GitHub Actions reaching in.
      - name: Publish build to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
