name: Deploy to Hostinger

on:
  push:
    branches:
      - main # Change this to your main branch if it's different (e.g., master)
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      # Upload dist/ straight to nabdassist.com's public_html. Hostinger's
      # Git auto-deploy is unavailable for this site (it's managed from an
      # agency account, which disables Git deployment), so FTP is the only
      # path in. If the FTP firewall rejects GitHub's runner IPs this step
      # times out instead of hanging the job.
      - name: Deploy to Hostinger via FTP
        run: npm run deploy
        timeout-minutes: 10
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: /

      # Keep a copy of each build on the deploy branch as a record of what
      # was shipped.
      - name: Publish build to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
